name: Build and Push WZML-X Docker

on:
  workflow_dispatch:
    inputs:
      docker_name:
        description: "Docker image name"
        required: true
        default: "wzml-x"
        type: string

      docker_tag:
        description: "Docker image tag"
        required: true
        default: "latest"
        type: string

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Name and Tag
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.docker_name || 'wzml-x' }}
          IMAGE_TAG: ${{ inputs.docker_tag || 'latest' }}
        run: |
          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "Invalid Docker image name"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag"
            exit 1
          fi

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

      - name: Show Docker Image
        run: |
          echo "Docker image published successfully"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
